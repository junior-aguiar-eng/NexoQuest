name: Publicar Documentacao e Demo Interativa (GitHub Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Compilar Frontend React e Bundle
        run: npm run build:view

      - name: Copiar Demo Interativo para a Documentacao
        run: |
          mkdir -p docs/public
          cp preview.html docs/public/demo.html

      - name: Compilar Site VitePress
        run: npm run docs:build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fazer Upload do Artefato dos Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Publicar no GitHub Pages
    steps:
      - name: Deploy nos GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
